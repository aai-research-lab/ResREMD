# Tier 2b in water. Ac-Pro-NMe in TIP3P-FB at constant volume. Pilot the
# ladder first: 20 to 40 percent neighbour acceptance. REST2 is here and not
# in the implicit-solvent spec: it needs explicit solvent.
name: proline_explicit
system: {name: proline_dipeptide, solvent: explicit, padding_nm: 1.2,
         npt_ns: 1.0}
# Fourteen rungs of a geometric ladder whose fifteenth, 440 K, is the
# reservoir.
temperatures_K: [300.0, 308.3, 316.9, 325.7, 334.7, 344.0, 353.5, 363.3,
                 373.4, 383.8, 394.4, 405.3, 416.6, 428.1]
seeds: [1, 2, 3]
run:
  duration_ns: 20
  exchange_interval_steps: 500
  trajectory_interval_steps: 500
  equilibration_ns: 0.2
  save_selection: solute
  save_states: all                 # every temperature, for MBAR
  platform: auto
methods:
  - name: remd
  - name: res_biased
    reservoir:
      generate: {temperature_K: 440.0, duration_ns: 100,
                 frame_interval_steps: 2500,
                 bias_torsions: [{atoms: omega, energy: "-k*sin(theta)^2",
                                  parameters: {k: 60.0}}]}
  # REST2 heats only the solute, so a few replicas span a wide range.
  # A short CPU pilot gave 15 to 45 percent neighbour acceptance; pilot it
  # longer on a GPU before a production run.
  - name: rest2
    temperatures_K: [300.0, 417.0, 580.0, 806.0, 1121.0, 1558.0, 2166.0,
                     3000.0]
    run: {rest2: true}
  - name: rest2_res
    note: REST2 with a reservoir of its own top state, stopping itself
    temperatures_K: [300.0, 417.0, 580.0, 806.0, 1121.0, 1558.0, 2166.0,
                     3000.0]
    run: {rest2: true}
    reservoir:
      generate: {temperature_K: 3000.0, rest2_run_temperature_K: 300.0,
                 duration_ns: 100, frame_interval_steps: 2500,
                 convergence_torsions: [omega], convergence_tv: 0.02}
reference: {kind: file, path: proline_explicit_reference.json}
analysis: {threshold_tv: 0.02, threshold_jsd: 0.02, mbar: true}
